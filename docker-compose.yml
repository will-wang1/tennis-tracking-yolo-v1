services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tennis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tennis}
      POSTGRES_DB: ${POSTGRES_DB:-tennis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      # Same credentials the app itself uses (S3_ACCESS_KEY/S3_SECRET_KEY in
      # .env) - MinIO's root user *is* the S3 access key pair here.
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-tennis}:${POSTGRES_PASSWORD:-tennis}@postgres:5432/${POSTGRES_DB:-tennis}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
    depends_on:
      - postgres
      - redis
      - minio
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
      args:
        # Set TORCH_INDEX_URL in .env (e.g. to
        # https://download.pytorch.org/whl/cpu) on a machine with no NVIDIA
        # GPU; leave unset on a real GPU machine to keep CUDA support.
        TORCH_INDEX_URL: "${TORCH_INDEX_URL:-}"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-tennis}:${POSTGRES_PASSWORD:-tennis}@postgres:5432/${POSTGRES_DB:-tennis}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      # Model weights are supplied at deploy time, not baked into the image -
      # point this at a host directory containing ball_detector.pt /
      # wasb_tennis_pretrained.pth.tar / court_net_pretrained.pt etc. See
      # backend/.env.example.
      - ./weights:/app/weights
    # Uncomment to run the worker on an NVIDIA GPU (requires the NVIDIA
    # Container Toolkit on the host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

  # Publishes the app to the internet over Tailscale Funnel, with nothing
  # installed on the host - no macOS installer, no sudo. Needs no host
  # networking either: it reaches the frontend container over the compose
  # network as http://frontend:80. Opt-in only (see README "Public access
  # over Tailscale"): `docker compose --profile tunnel up -d`.
  tailscale:
    image: tailscale/tailscale:latest
    hostname: tennisva
    environment:
      # Left blank here (rather than a hard-required var) so that plain
      # `docker compose up` for everyone NOT using the tunnel doesn't break -
      # profiles only gate which services *start*, not env interpolation,
      # which docker compose validates for every service regardless. The
      # container itself fails fast with a clear error if this is empty.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
    volumes:
      - tailscale_state:/var/lib/tailscale
    cap_add:
      - NET_ADMIN
    depends_on:
      - frontend
    profiles:
      - tunnel

  # Alternative to the tailscale service above: a free, anonymous Cloudflare
  # "quick tunnel" - no account, no signup, nothing downloaded to the host
  # (cloudflared runs only inside this container). Trade-off vs Tailscale:
  # no stable URL (a new https://<random>.trycloudflare.com is assigned
  # each time this restarts) and Cloudflare's edge caps request bodies
  # around 100MB, which large match-video uploads will exceed - fine for a
  # quick demo, not for real use. Opt-in: `docker compose --profile
  # cloudflare up -d`, then find the assigned URL with
  # `docker compose logs cloudflared`.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://frontend:80
    depends_on:
      - frontend
    profiles:
      - cloudflare

volumes:
  postgres_data:
  minio_data:
  tailscale_state:
