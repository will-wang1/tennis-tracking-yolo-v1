services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tennis
      POSTGRES_PASSWORD: tennis
      POSTGRES_DB: tennis
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://tennis:tennis@postgres:5432/tennis
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
    depends_on:
      - postgres
      - redis
      - minio
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
      args:
        # Set TORCH_INDEX_URL in .env (e.g. to
        # https://download.pytorch.org/whl/cpu) on a machine with no NVIDIA
        # GPU; leave unset on a real GPU machine to keep CUDA support.
        TORCH_INDEX_URL: "${TORCH_INDEX_URL:-}"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://tennis:tennis@postgres:5432/tennis
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      # Model weights are supplied at deploy time, not baked into the image -
      # point this at a host directory containing ball_detector.pt /
      # wasb_tennis_pretrained.pth.tar / court_net_pretrained.pt etc. See
      # backend/.env.example.
      - ./weights:/app/weights
    # Uncomment to run the worker on an NVIDIA GPU (requires the NVIDIA
    # Container Toolkit on the host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  minio_data:
